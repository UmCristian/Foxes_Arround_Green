<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Foxes Arround Green · Laboratorio WebXR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; font-family: sans-serif; }
    canvas { display: block; }
    #animalSelector {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px;
      border-radius: 10px;
      pointer-events: auto;
      touch-action: manipulation;
      white-space: nowrap;
    }
    #animalSelector button {
      margin: 0;
      padding: 8px 12px;
      font-size: 15px;
      cursor: pointer;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="animalSelector">
    <button onclick="setAnimal('fox')">🦊 Zorro</button>
    <button onclick="setAnimal('rabbit')">🐇 Conejo</button>
    <button onclick="setAnimal('bird')">🐦 Pájaro</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
